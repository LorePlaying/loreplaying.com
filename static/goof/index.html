<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f5">
    <meta name="description" content="A simple, infinite canvas for drawing.">
    <title>GOOF — Infinite canvas</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/simple.js?v=3"></script>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="drawing-canvas" aria-label="Infinite drawing canvas"></canvas>

      <header class="topbar">
        <a class="brand" href="./" aria-label="GOOF canvas">
          <span class="brand-mark" aria-hidden="true">g</span>
          <span>goof</span>
        </a>
        <div class="menu-wrap">
          <button class="icon-button" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" title="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </button>
          <div class="menu" id="app-menu" hidden>
            <button type="button" data-action="export-png">Export PNG</button>
            <button type="button" data-action="export-svg">Export SVG</button>
            <div class="menu-separator"></div>
            <button type="button" data-action="undo">Undo</button>
            <button type="button" data-action="redo">Redo</button>
            <div class="menu-separator"></div>
            <button type="button" data-action="clear">Clear canvas</button>
            <button type="button" data-action="theme">Switch to dark mode</button>
          </div>
        </div>
      </header>

      <div class="text-entry" id="text-entry" contenteditable="true" role="textbox" aria-label="Canvas text" hidden></div>

      <aside class="zoom-controls" aria-label="Canvas zoom">
        <button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="zoom-level" id="zoom-level" type="button" title="Reset zoom">100%</button>
        <button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      </aside>

      <section class="tool-dock" aria-label="Drawing tools">
        <div class="tool-group" role="toolbar" aria-label="Tools">
          <button class="tool-button" type="button" data-tool="hand" aria-label="Pan canvas" title="Pan (H or Space)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V5a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.5-2.7L3 14.5a1.8 1.8 0 0 1 2.8-2.2L8 15"/></svg>
          </button>
          <button class="tool-button is-active" type="button" data-tool="select" aria-label="Select" title="Select (V)" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 .8-3.5 6.2L5 3Z"/></svg>
          </button>
          <button class="tool-button" type="button" data-tool="brush" aria-label="Draw" title="Draw (D)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 10-10a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/><path d="m12.5 7.5 4 4"/></svg>
          </button>
          <button class="tool-button" type="button" data-tool="eraser" aria-label="Eraser" title="Eraser (E)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 12-5 5H8L3 16 15 4a2.1 2.1 0 0 1 3 0"/><path d="m8 21 7-7"/></svg>
          </button>
          <div class="shape-wrap">
            <button class="tool-button" id="shape-tool" type="button" aria-label="Shapes" title="Shapes (S)" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><circle cx="17" cy="7.5" r="3.5"/><path d="m17 14 4 7h-8l4-7Z"/></svg>
            </button>
            <div class="shape-menu" id="shape-menu" hidden aria-label="Choose a shape">
              <button type="button" data-shape="rectangle" aria-label="Rectangle" title="Rectangle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
              <button type="button" data-shape="ellipse" aria-label="Ellipse" title="Ellipse"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
              <button type="button" data-shape="line" aria-label="Line" title="Line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"/></svg></button>
              <button type="button" data-shape="triangle" aria-label="Triangle" title="Triangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 9 16H3l9-16Z"/></svg></button>
              <button type="button" data-shape="arrow" aria-label="Arrow" title="Arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
            </div>
          </div>
          <button class="tool-button" type="button" data-tool="text" aria-label="Text" title="Text (T)" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6V4h16v2M12 4v16m-4 0h8"/></svg>
          </button>
        </div>
        <span class="dock-divider" aria-hidden="true"></span>
        <label class="color-control" title="Brush color">
          <input id="color-input" type="color" value="#34314a" aria-label="Brush color">
          <span class="color-swatch" id="color-swatch" aria-hidden="true"></span>
        </label>
        <label class="size-control" title="Brush size">
          <span class="size-preview" id="size-preview" aria-hidden="true"></span>
          <input id="size-input" type="range" min="1" max="48" value="6" aria-label="Brush size">
        </label>
        <span class="dock-divider history-divider" aria-hidden="true"></span>
        <div class="history-group">
          <button class="tool-button" id="undo-button" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
          </button>
          <button class="tool-button" id="redo-button" type="button" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h2"/></svg>
          </button>
        </div>
      </section>
      <div class="status-message" id="status-message" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
